app:
  name: referral
  version: 1.0.0
  env: production

http:
  port: "8999"
  cookie_name: referral_session
  refresh_cookie_name: referral_refresh
  cookie_secure: true
  allowed_origins:
    - https://referral.vivl.cc
    - http://localhost:5173
    - http://localhost:5174

jwt:
  secret: replace-with-at-least-32-random-characters
  access_ttl: 15m
  refresh_ttl: 168h

registration:
  demo_enabled: true
  demo_code: "123456"

log:
  dir: /opt/keep-2026/shared/logs
  level: info

postgres:
  pool_max: 2
  url: postgres://referral:replace-password@127.0.0.1:5432/referral?sslmode=disable

redis:
  pool_max: 5
  url: redis://127.0.0.1:6379/0
  password: replace-redis-password
  prefix: referral

sentry:
  dsn: https://public@example.com/1
tracing:
  enabled: false
metrics:
  enabled: true
swagger:
  enabled: false

google:
  client_id: ""
  client_secret: ""
  redirect_url: https://referral.vivl.cc/api/v1/auth/google/callback
admin:
  user_ids: []
  emails:
    - admin@example.com
  bootstrap:
    enabled: false
    name: superadmin
    email: admin@example.com
    password: replace-before-enabling
