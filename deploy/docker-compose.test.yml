services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: referral_test
      POSTGRES_USER: referral_test
      POSTGRES_PASSWORD: referral_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referral_test -d referral_test"]
      interval: 1s
      timeout: 3s
      retries: 30
