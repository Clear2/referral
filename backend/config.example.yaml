app:
  name: referral
  version: 1.0.0
  env: development

http:
  port: "8999"
  cookie_name: referral_session
  refresh_cookie_name: referral_refresh
  cookie_secure: false
  allowed_origins:
    - http://localhost:5173
    - http://localhost:5174

log:
  dir: /tmp/logs
  level: debug

postgres:
  pool_max: 2
  url: postgres://user:apppassword@localhost:5432/referral?sslmode=disable

redis:
  pool_max: 10
  url: redis://localhost:6379/0
  password: ""
  prefix: referral

jwt:
  secret: replace-with-at-least-32-random-characters
  access_ttl: 15m
  refresh_ttl: 168h

registration:
  demo_enabled: true
  demo_code: "123456"

admin:
  user_ids: []
  emails: []
  bootstrap:
    enabled: false
    name: administrator
    email: admin@example.com
    password: change-me-before-enabling

sentry:
  dsn: https://public@example.com/1

tracing:
  enabled: false

metrics:
  enabled: true

swagger:
  enabled: true

google:
  client_id: ""
  client_secret: ""
  redirect_url: http://localhost:8999/api/v1/auth/google/callback
