host: localhost:4000
info:
  contact: {}
  description: This is a sample server Petstore server.
  title: Gin APP API
  version: "1.0"
paths:
  /api/v1/admin/credit-transactions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.CreditTransactionListAPIResponse'
      summary: List all referral credit transactions
      tags:
      - Admin Referrals
  /api/v1/admin/referral-stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.StatsAPIResponse'
      summary: Get global referral reward statistics
      tags:
      - Admin Referrals
  /api/v1/admin/referrals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ReferralListAPIResponse'
      summary: List all referral rewards
      tags:
      - Admin Referrals
  /api/v1/auth/google/callback:
    get:
      parameters:
      - description: Google authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/errors.APIError'
      summary: Complete Google OAuth login
      tags:
      - Authentication
  /api/v1/auth/google/login:
    get:
      responses:
        "307":
          description: Temporary Redirect
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errors.APIError'
      summary: Start Google OAuth login
      tags:
      - Authentication
  /api/v1/referrals/register:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.RegistrationAPIResponse'
      summary: Register a new user through an invitation
      tags:
      - Referrals
  /api/v1/users/{id}/referral-code:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.InvitationAPIResponse'
      summary: Generate or return a user's invitation link
      tags:
      - Referrals
  /api/v1/users/{id}/referral-dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.DashboardAPIResponse'
      summary: Get referral statistics, history and credit ledger
      tags:
      - Referrals
  /api/v1/users/me:
    get:
      description: Retrieve the authenticated user's information
      operationId: getCurrentUser
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user
          schema:
            $ref: '#/definitions/response.UserAPIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.APIError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      summary: Get current user
      tags:
      - Users
securityDefinitions:
  APIAuth:
    in: cookie
    name: app_cookie_name
    type: apiKey
  OpenAPIAuth:
    in: header
    name: PRIVATE-TOKEN
    type: apiKey
swagger: "2.0"
